# Keystone with its PostgreSQL. Copy .env.example to .env, set SPA_MASTER_KEY and SPA_ADMIN_PASSWORD, then:
#   docker compose up -d --build
#
# Keystone was called SPA before: the compose project and the service are now "keystone", while the database name,
# its user and the data volume keep the old "spa" names so that an existing installation keeps its data.
name: keystone

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # The database and its user keep the names from before the rename (existing data).
      POSTGRES_DB: spa
      POSTGRES_USER: spa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spa -d spa"]
      interval: 5s
      timeout: 3s
      retries: 20

  keystone:
    build: .
    image: keystone:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      SPA_DATABASE_URL: postgres://spa:${POSTGRES_PASSWORD:-spa}@postgres:5432/spa?sslmode=disable
      SPA_PUBLIC_URL: ${SPA_PUBLIC_URL:-http://localhost:8080}
    ports:
      - "${SPA_PORT:-8080}:8080"

volumes:
  pgdata:
    # The volume keeps the name it had when the project was "spa" (compose named it <project>_pgdata), so the data
    # of an existing installation is found again. If your checkout directory had another name, see `docker volume ls`.
    name: spa_pgdata
