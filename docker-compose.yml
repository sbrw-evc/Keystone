# Keystone with its PostgreSQL and OpenBao. Run ./install.sh (it makes .env and the unseal key of OpenBao), then open
# Keystone in a browser: the setup wizard asks for the setup code from `docker compose logs keystone`, connects
# PostgreSQL and OpenBao, and creates the first administrator. Everything else is set in Keystone.
#
# Keystone was called SPA before: the compose project and the service are now "keystone", while the database name,
# its user and the data volume keep the old "spa" names so that an existing installation keeps its data.
name: keystone

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # The database and its user keep the names from before the rename (existing data).
      POSTGRES_DB: spa
      POSTGRES_USER: spa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (install.sh makes it)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spa -d spa"]
      interval: 5s
      timeout: 3s
      retries: 20

  openbao:
    image: openbao/openbao:${OPENBAO_VERSION:-2.6.2}
    restart: unless-stopped
    command: ["server", "-config=/openbao/config/config.hcl"]
    cap_add: [IPC_LOCK]
    volumes:
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - ./openbao/keys:/openbao/keys:ro
      - ./openbao/data:/openbao/data

  keystone:
    build: .
    image: onedev.evcsbrw.ru/monitoring/keystone/keystone:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      openbao:
        condition: service_started
    # Only read by an installation from before the setup wizard: its SPA_* and BAO_* settings are taken over once.
    env_file:
      - path: .env
        required: false
    volumes:
      # bootstrap.json, the AppRole secret_id of OpenBao, the setup code
      - keystone-data:/data
    ports:
      - "${SPA_PORT:-8080}:8080"

volumes:
  pgdata:
    # The volume keeps the name it had when the project was "spa" (compose named it <project>_pgdata), so the data
    # of an existing installation is found again. If your checkout directory had another name, see `docker volume ls`.
    name: spa_pgdata
  keystone-data:
