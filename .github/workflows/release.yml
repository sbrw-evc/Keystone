name: Release

# A tag vX.Y.Z publishes the image ghcr.io/<owner>/keystone (X.Y.Z, X.Y, latest; amd64 and arm64) and a GitHub
# release with the deploy bundle: the compose stack pinned to that image, ready for `./install.sh` without the sources.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v1.0.0"
        required: true

permissions:
  contents: write
  packages: write

env:
  APP: keystone
  IMAGE: ghcr.io/${{ github.repository_owner }}/keystone

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=keystone
            org.opencontainers.image.description=Keystone: who a person is and what they may do (OpenID Connect, roles, passkeys, directories)
          annotations: |
            org.opencontainers.image.description=Keystone: who a person is and what they may do (OpenID Connect, roles, passkeys, directories)
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Deploy bundle
        run: |
          set -eu
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          DIR="dist/$APP-$VERSION"
          mkdir -p "$DIR"
          for f in docker-compose.yml .env.example install.sh openbao README.md README.ru.md LICENSE; do
            [ -e "$f" ] && cp -r "$f" "$DIR/"
          done
          # The application runs from the published image: no build section, the image of this version.
          IMG="$IMAGE:$VERSION" yq -i '(.services[] | select(has("build"))) |= (del(.build) | .image = strenv(IMG) | .pull_policy = "missing")' "$DIR/docker-compose.yml"
          tar -C dist -czf "dist/$APP-$VERSION-deploy.tar.gz" "$APP-$VERSION"
          ( cd dist && sha256sum "$APP-$VERSION-deploy.tar.gz" > SHA256SUMS )
          NOTES=".github/release-notes/$TAG.md"
          # shellcheck disable=SC2016 # the backticks are Markdown, not an expansion
          { [ -f "$NOTES" ] && cat "$NOTES" && echo; \
            printf '## Install\n\n```bash\ncurl -L https://github.com/%s/releases/download/%s/%s-%s-deploy.tar.gz | tar xz\ncd %s-%s && ./install.sh\n```\n\nImage: `%s:%s`\n' \
              "$GITHUB_REPOSITORY" "$TAG" "$APP" "$VERSION" "$APP" "$VERSION" "$IMAGE" "$VERSION"; } > dist/notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Keystone ${{ inputs.tag || github.ref_name }}
          body_path: dist/notes.md
          generate_release_notes: true
          make_latest: true
          files: |
            dist/keystone-*-deploy.tar.gz
            dist/SHA256SUMS
